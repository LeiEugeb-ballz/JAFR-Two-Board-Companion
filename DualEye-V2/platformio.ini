[env:waveshare-dualeye]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    esp_websocket_client = https://components-file.espressif.com/components/espressif/esp_websocket_client/1.8.0/espressif__esp_websocket_client-v1.8.0.zip
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.flash_size = 16MB
build_unflags = -DARDUINO_USB_MODE=0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DJAFR_RADIO_CHANNEL=5
monitor_speed = 115200
upload_speed = 921600
